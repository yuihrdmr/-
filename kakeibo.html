<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#059669">
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f0; --card:#ffffff; --ink:#0c1f17; --sub:#6b7d74;
    --line:#e8efeb;
    --brand:#059669; --brand-d:#047857; --brand-l:#10b981; --brand-xl:#34d399;
    --tint:#ecfdf5; --tint-line:#bbf7d0;
    --red:#ef4444; --green:#16a34a; --amber:#f59e0b; --blue:#2563eb;
    --teal:#059669; --teal-l:#10b981;
    --ring:rgba(5,150,105,.18);
    --shadow:0 1px 2px rgba(12,40,28,.04), 0 8px 24px -12px rgba(12,40,28,.16);
    --shadow-card:0 1px 2px rgba(12,40,28,.05), 0 14px 36px -18px rgba(12,40,28,.20);
    --shadow-brand:0 8px 22px -8px rgba(5,150,105,.45);
    --r:20px;
    --fnum:"Plus Jakarta Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    color:var(--ink);font-size:15px;line-height:1.55;letter-spacing:.01em;
    padding-bottom:48px;
    background:
      radial-gradient(900px 480px at 105% -8%, rgba(52,211,153,.28), transparent 60%),
      radial-gradient(760px 420px at -12% 4%, rgba(16,185,129,.16), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--fnum);font-variant-numeric:tabular-nums;letter-spacing:0}

  /* ---- ヘッダー ---- */
  header{
    color:#fff;padding:20px 18px 22px;position:sticky;top:0;z-index:10;
    background:linear-gradient(135deg,#047857 0%,#059669 45%,#10b981 100%);
    border-radius:0 0 26px 26px;
    box-shadow:0 10px 30px -12px rgba(4,120,87,.55);
    overflow:hidden;
  }
  header::after{
    content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none;
  }
  .h-title{font-size:20px;font-weight:800;margin:0 0 14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:6px;
  }
  .month-nav button{
    background:rgba(255,255,255,.16);border:0;color:#fff;font-size:22px;
    width:40px;height:40px;border-radius:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;
  }
  .month-nav button:active{background:rgba(255,255,255,.34);transform:scale(.94)}
  .month-label{text-align:center;flex:1}
  .month-label .m{font-size:17px;font-weight:800;letter-spacing:.02em}
  .month-label .r{font-size:11px;opacity:.85;font-family:var(--fnum)}

  main{max-width:560px;margin:0 auto;padding:18px 16px}

  /* ---- カード ---- */
  .card{
    background:var(--card);border:1px solid rgba(232,239,235,.9);
    border-radius:var(--r);padding:20px;margin-bottom:16px;
    box-shadow:var(--shadow-card);
  }
  .card h2{
    font-size:12px;margin:0 0 16px;color:var(--sub);font-weight:700;
    letter-spacing:.08em;text-transform:none;display:flex;align-items:center;gap:7px;
  }
  .card h2::before{content:"";width:4px;height:14px;border-radius:3px;background:linear-gradient(var(--brand-l),var(--brand-d))}

  /* ---- サマリー ---- */
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:15px;padding:13px 14px}
  .stat .lab{font-size:11px;color:var(--sub);margin-bottom:5px;font-weight:500}
  .stat .val{font-size:19px;font-weight:800;font-family:var(--fnum);font-variant-numeric:tabular-nums}
  .stat.income .val{color:var(--green)}
  .stat.expense .val{color:var(--red)}
  .stat.balance{
    grid-column:span 2;color:#fff;border:0;
    background:linear-gradient(135deg,#047857,#10b981);
    box-shadow:var(--shadow-brand);position:relative;overflow:hidden;
  }
  .stat.balance::after{content:"";position:absolute;right:-30px;bottom:-50px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
  .stat.balance .lab{color:rgba(255,255,255,.85)}
  .stat.balance .val{font-size:27px;color:#fff}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .stat.balance .pos,.stat.balance .neg{color:#fff}

  .bar-wrap{margin-top:16px}
  .bar-track{height:10px;background:#e7eeea;border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;transition:width .4s ease}
  .bar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:7px;font-weight:500}

  /* ---- 行 ---- */
  .row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .nm{flex:1;min-width:0}
  .row .nm .n{font-weight:700;font-size:14px}
  .row .nm .b{font-size:11px;color:var(--sub)}
  .num-in{
    width:100px;text-align:right;border:1.5px solid var(--line);border-radius:12px;
    padding:9px 11px;font-size:15px;font-family:var(--fnum);font-variant-numeric:tabular-nums;
    background:#fbfdfc;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .num-in:focus{outline:none;border-color:var(--brand-l);background:#fff;box-shadow:0 0 0 4px var(--ring)}
  .num-in.budget{width:86px;background:#fffbeb;border-color:#fde68a}
  .num-in.budget:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
  .num-in.auto{width:100px;background:#f1f5f9;color:var(--sub);border-style:dashed;cursor:default}
  .num-in.auto:focus{outline:none;box-shadow:none;border-color:var(--line)}
  .yen{font-size:12px;color:var(--sub)}

  .mini-bar{height:6px;background:#eef3f0;border-radius:99px;overflow:hidden;margin-top:7px}
  .mini-fill{height:100%;border-radius:99px;transition:width .4s ease}
  .cat-bar{padding:0 0 12px;margin-top:-4px;border-bottom:1px solid var(--line)}
  .cat-bar .cb-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin:0 0 5px;font-weight:500}
  .wk-total{font-size:13px;color:var(--ink);margin-top:12px;text-align:right;font-weight:800;font-family:var(--fnum)}
  .cat-total{
    display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 16px;
    border-radius:14px;background:var(--tint);border:1px solid var(--tint-line);
    font-weight:800;color:var(--brand-d);
  }
  .cat-total span:last-child{font-family:var(--fnum)}

  /* ---- 資産 ---- */
  .asset-grid .row .num-in{width:128px}
  canvas{width:100%;height:170px;display:block;margin-top:4px}
  .asset-total{
    text-align:center;border-radius:16px;padding:16px;margin-bottom:14px;
    background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid var(--tint-line);
  }
  .asset-total .lab{font-size:11px;color:var(--brand-d);font-weight:600;letter-spacing:.04em}
  .asset-total .val{font-size:26px;font-weight:800;color:var(--brand-d);font-family:var(--fnum);margin-top:2px}

  /* ---- ボタン ---- */
  .btn{
    width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;
    letter-spacing:.02em;color:#fff;cursor:pointer;margin-top:8px;
    background:linear-gradient(135deg,#059669,#10b981);
    box-shadow:var(--shadow-brand);transition:transform .12s,box-shadow .15s,filter .15s;
  }
  .btn:active{transform:translateY(1px) scale(.99);filter:brightness(.96)}
  .btn.ghost{
    background:#fff;color:var(--brand-d);border:1.5px solid var(--tint-line);
    box-shadow:none;
  }
  .btn.ghost:active{background:var(--tint)}

  .hist{font-size:13px;color:var(--sub);max-height:160px;overflow:auto;margin-top:12px}
  .hist .hr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .hist .hr span:nth-child(2){font-weight:700;color:var(--ink);font-family:var(--fnum)}
  .foot{text-align:center;font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6}
  .del-link{font-size:11px;color:var(--red);background:none;border:0;cursor:pointer;margin-left:6px}

  /* ---- 明細入力（食費・交際費） ---- */
  .entry-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .entry-form input{
    border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;font-size:14px;
    background:#fbfdfc;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .entry-form input:focus{outline:none;border-color:var(--brand-l);background:#fff;box-shadow:0 0 0 4px var(--ring)}
  .ef-date{flex:1 1 130px;font-family:var(--fnum);font-variant-numeric:tabular-nums}
  .ef-name{flex:1 1 130px}
  .ef-amt{flex:1 1 90px;text-align:right;font-family:var(--fnum);font-variant-numeric:tabular-nums}
  .ef-memo{flex:1 1 100%}
  .ef-add{
    border:0;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:800;
    background:linear-gradient(135deg,#059669,#10b981);color:#fff;cursor:pointer;flex:0 0 auto;
    box-shadow:var(--shadow-brand);transition:transform .12s,filter .15s;
  }
  .ef-add:active{transform:scale(.96);filter:brightness(.96)}
  .wk-group{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .wk-group .wkg-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .wk-group .wkg-h .wkg-n{font-weight:800;font-size:13px}
  .wk-group .wkg-h .wkg-r{color:var(--sub);font-size:11px;font-family:var(--fnum)}
  .entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .entry:last-child{border-bottom:0}
  .entry .e-date{color:var(--sub);font-family:var(--fnum);font-variant-numeric:tabular-nums;flex:0 0 auto;width:42px}
  .entry .e-memo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .e-amt{font-weight:700;font-family:var(--fnum);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .entry .e-del{flex:0 0 auto;color:var(--red);background:none;border:0;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;opacity:.7}
  .entry .e-del:active{opacity:1}
  .wkg-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:9px;font-weight:500}
  .wkg-foot span:last-child{font-family:var(--fnum)}
  .empty-note{color:var(--sub);font-size:12px;padding:12px 0;text-align:center}

  /* ---- タブ切り替え（食費・交際費） ---- */
  .tab-bar{display:flex;gap:6px;background:var(--bg);border-radius:15px;padding:5px;margin-bottom:18px}
  .tab-btn{
    flex:1;border:0;border-radius:11px;padding:11px 8px;font-size:15px;font-weight:800;
    cursor:pointer;background:transparent;color:var(--sub);
    transition:background .18s,color .18s,box-shadow .18s;letter-spacing:.01em;font-family:inherit;
  }
  .tab-btn:active{opacity:.8}
  .card-tabs{transition:border-color .2s}
  .card-tabs.tf .tab-btn[data-tab="food"]{background:#fff;color:#047857;box-shadow:0 2px 10px rgba(5,150,105,.22)}
  .card-tabs.tk .tab-btn[data-tab="kosai"]{background:#fff;color:#c2410c;box-shadow:0 2px 10px rgba(234,88,12,.22)}
  .card-tabs.tf{border-color:#bbf7d0;background:linear-gradient(180deg,#f0fdf4,#ffffff 80px)}
  .card-tabs.tk{border-color:#fed7aa;background:linear-gradient(180deg,#fff7ed,#ffffff 80px)}
  .card-tabs.tf .ef-add{background:linear-gradient(135deg,#059669,#10b981);box-shadow:var(--shadow-brand)}
  .card-tabs.tk .ef-add{background:linear-gradient(135deg,#ea580c,#f97316);box-shadow:0 8px 22px -8px rgba(234,88,12,.45)}
  .card-tabs.tk .entry-form input:focus{border-color:#fb923c;box-shadow:0 0 0 4px rgba(249,115,22,.15)}
  .card-tabs.tf .wk-total{color:#047857}
  .card-tabs.tk .wk-total{color:#c2410c}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .groups-scroll{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<header>
  <h1 class="h-title">💰 家計簿</h1>
  <div class="month-nav">
    <button id="prevM">‹</button>
    <div class="month-label">
      <div class="m" id="mLabel">—</div>
      <div class="r" id="mRange">—</div>
    </div>
    <button id="nextM">›</button>
  </div>
</header>

<main>
  <!-- タブ切り替え（食費・交際費） -->
  <div class="card card-tabs tf" id="entryCard">
    <div class="tab-bar">
      <button class="tab-btn" data-tab="food" id="tabFood">🍚 食費</button>
      <button class="tab-btn" data-tab="kosai" id="tabKosai">🍻 交際費</button>
    </div>

    <!-- 食費パネル -->
    <div class="tab-panel active" id="panelFood">
      <div style="font-size:11px;color:var(--sub);margin-bottom:10px;font-weight:500">週予算 ¥10,000</div>
      <div class="entry-form">
        <input type="date" class="ef-date" id="foodDate">
        <input type="number" inputmode="numeric" class="ef-amt" id="foodAmt" placeholder="金額">
        <input type="text" class="ef-memo" id="foodMemo" placeholder="メモ（任意）">
        <button class="ef-add" id="foodAdd">追加</button>
      </div>
      <div class="groups-scroll" id="foodGroups"></div>
      <div class="wk-total" id="foodTotal">合計 ¥0</div>
    </div>

    <!-- 交際費パネル -->
    <div class="tab-panel" id="panelKosai">
      <div style="font-size:11px;color:var(--sub);margin-bottom:10px;font-weight:500">週予算 約¥7,500</div>
      <div class="entry-form">
        <input type="date" class="ef-date" id="kosaiDate">
        <input type="number" inputmode="numeric" class="ef-amt" id="kosaiAmt" placeholder="金額">
        <input type="text" class="ef-memo" id="kosaiMemo" placeholder="メモ（任意）">
        <button class="ef-add" id="kosaiAdd">追加</button>
      </div>
      <div class="groups-scroll" id="kosaiGroups"></div>
      <div class="wk-total" id="kosaiTotal">合計 ¥0</div>
    </div>
  </div>

  <!-- 固定費・変動費 -->
  <div class="card">
    <h2>支出カテゴリ（予算 / 実績）</h2>
    <div id="catList"></div>
    <div class="cat-total">
      <span>固定費 合計（実績）</span>
      <span id="fixedTotal">¥0</span>
    </div>
  </div>

  <!-- サブスク（追加・削除できる） -->
  <div class="card">
    <h2>📺 サブスク（毎月固定・自動計上）</h2>
    <div id="subsList"></div>
    <div class="entry-form">
      <input type="text" class="ef-name" id="subName" placeholder="サービス名">
      <input type="number" inputmode="numeric" class="ef-amt" id="subAmt" placeholder="金額">
      <button class="ef-add" id="subAdd">追加</button>
    </div>
    <div class="cat-total">
      <span>サブスク 合計</span>
      <span id="subsTotal">¥0</span>
    </div>
  </div>

  <button class="btn" id="saveNow" style="margin-top:4px">☁️ データを保存する</button>

  <p class="foot" id="syncStatus">読み込み中…</p>
  <p class="foot">データはGoogleスプレッドシートに自動保存され、どの端末からでも同じ内容が見られます。</p>
</main>

<script>
"use strict";
// Googleスプレッドシート連携（Apps Script Web App）
const API_URL = 'https://script.google.com/macros/s/AKfycbxymi4NE_2yYh6934zS18yEyJOVhZh0Zaex_JTXxru8FK9yzmPPP1E3F-6ZTlMTMK8vvg/exec';
const CACHE_KEY = 'kakeibo_cache_v1';   // 起動時に即表示するためのローカルキャッシュ
const yen = n => '¥' + Math.round(n||0).toLocaleString('ja-JP');
const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- 支出カテゴリ定義（予算は固定。autoFillは実績を自動入力） ----
const CATS = [
  {key:'rent',     name:'家賃',      budget:58000},
  {key:'electric', name:'電気代',    budget:7000,  note:'毎月変動'},
  {key:'watergas', name:'水道・ガス', budget:10000},
  {key:'beauty',   name:'美容院',    budget:10000, note:'毎月変動'},
  {key:'nisa',     name:'NISA積立',  budget:60000, autoFill:true},
  {key:'shohin',   name:'消耗品',    budget:5000,  bar:true},
];
// ---- サブスク初期値（追加・削除可能。予算=実績で自動計上） ----
const DEFAULT_SUBS = [
  {name:'ラジコ',           amount:480},
  {name:'テレ東BIZ',        amount:1200},
  {name:'YouTube Premium',  amount:1280},
  {name:'Amazon Prime',     amount:600},
  {name:'スマホ代',          amount:2500},
];
const cloneDefaultSubs = () => DEFAULT_SUBS.map(s=>({name:s.name, amount:s.amount}));
const FOOD_WK = 10000, KOSAI_WK = 7500;

// ---- 状態 ----
let DB = base();
let loaded = false;       // 保存を許可してよいか（キャッシュ or クラウドのどちらかを読めたらtrue）
let localEdited = false;  // 起動後にユーザーが編集したか（クラウド受信で上書きしないため）
let curKey = periodKey(new Date());

function base(){ return {months:{}, subs:cloneDefaultSubs(), assets:{cash:0,stock:0,fund:0,bond:0,history:[]}}; }

// 読み込んだデータの形を整える（後方互換）
function normalize(d){
  if(!d || typeof d!=='object' || Array.isArray(d)) d = base();
  if(!d.assets) d.assets = base().assets;
  ['cash','stock','fund','bond'].forEach(k=>{ if(typeof d.assets[k]!=='number') d.assets[k]=0; });
  if(!Array.isArray(d.assets.history)) d.assets.history=[];
  if(!d.months || typeof d.months!=='object') d.months={};
  // サブスク：未定義なら初期値を投入（空配列なら「全部消した」状態として尊重）
  if(!Array.isArray(d.subs)) d.subs = cloneDefaultSubs();
  d.subs = d.subs.filter(s=>s && typeof s==='object').map(s=>({name:String(s.name||''), amount:+s.amount||0}));
  return d;
}

// 状態表示（フッター）
function setStatus(msg){ const el=document.getElementById('syncStatus'); if(el) el.textContent=msg; }
function nowStr(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

// ---- ローカルキャッシュ（即時表示用） ----
function writeCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(DB)); }catch(e){}
}

// ---- 保存：ローカルキャッシュ即時 ＋ Googleスプレッドシート（デバウンス） ----
let saveTimer=null;
function save(){
  localEdited = true;
  writeCache();            // まずローカルへ即保存（オフラインでも消えない）
  if(!loaded){ return; }   // クラウドの初期読込前は送信しない
  setStatus('未保存…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(cloudSave,800);   // 連続入力をまとめて送信（デバウンス）
}

function cloudSave(){
  clearTimeout(saveTimer);
  writeCache();
  if(!loaded){ return; }
  setStatus('スプレッドシートに保存中…');
  // GASのCORSプリフライトを避けるため text/plain で送信
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(DB)
  })
  .then(r=>r.text())
  .then(()=>{ localEdited=false; setStatus(`スプレッドシートに保存しました ✓ (${nowStr()})`); })
  .catch(()=>setStatus('⚠️ 保存に失敗しました。通信を確認し「データを保存する」を押してください'));
}

// ---- 起動：キャッシュを即表示 → 裏で最新を取得して更新 ----
async function init(){
  // 1) ローカルキャッシュがあれば即座に表示（ラグなし）
  let hasCache=false;
  try{
    const cached=localStorage.getItem(CACHE_KEY);
    if(cached){
      DB=normalize(JSON.parse(cached));
      loaded=true;                // キャッシュがあるので編集・保存を許可
      hasCache=true;
      render();
      setStatus('前回のデータを表示中…最新を確認しています');
    }
  }catch(e){ /* キャッシュ破損は無視 */ }
  if(!hasCache){
    render();                     // キャッシュなしは空の骨組みを描画
    setStatus('スプレッドシートから読み込み中…');
  }

  // 2) バックグラウンドでスプレッドシートの最新を取得
  try{
    const res=await fetch(API_URL,{method:'GET',cache:'no-store'});
    const txt=await res.text();
    const data= txt && txt.trim() ? JSON.parse(txt) : base();
    // 起動後にユーザーが編集していなければ最新で上書き（編集中なら端末の入力を優先）
    if(!localEdited){
      DB=normalize(data);
      render();
    }
    loaded=true;                  // 保存を許可
    writeCache();                 // 最新をキャッシュへ反映
    setStatus(`スプレッドシートと同期済み ✓ (${nowStr()})`);
  }catch(e){
    if(hasCache){
      setStatus('⚠️ オフライン：前回のデータを表示中（オンライン復帰後に保存されます）');
    }else{
      loaded=false;               // 何も読めない場合は保存禁止（クラウドを壊さない）
      setStatus('⚠️ 読み込み失敗：通信を確認してページを再読み込みしてください（保存は無効）');
    }
  }
}

// ---- 日付ユーティリティ ----
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function shortDate(s){ const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function periodStartDate(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m-1,16); }
// 期間開始（16日）からの週インデックス（0始まり）
function weekIndex(dateStr,k){
  const start=periodStartDate(k);
  const d=parseDate(dateStr);
  let diff=Math.floor((d-start)/(86400000*7));
  return diff<0?0:diff;
}
function weekRange(wi,k){
  const start=periodStartDate(k);
  const a=new Date(start); a.setDate(start.getDate()+wi*7);
  const b=new Date(a); b.setDate(a.getDate()+6);
  const f=d=>`${d.getMonth()+1}/${d.getDate()}`;
  return `${f(a)} 〜 ${f(b)}`;
}

// 16日始まりの期間キー（その期間の開始日が属する年月）
function periodKey(d){
  let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()<16){ m--; if(m<0){m=11;y--;} }
  return y+'-'+String(m+1).padStart(2,'0');
}
function keyToRange(k){
  const [y,m]=k.split('-').map(Number);
  const start=new Date(y,m-1,16);
  const end=new Date(y,m,15);
  const f=d=>`${d.getMonth()+1}/${d.getDate()}`;
  return {start,end,label:`${y}年${m}月度`,range:`${f(start)} 〜 ${f(end)}`};
}
function shiftMonth(k,delta){
  const [y,m]=k.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

// 旧形式（週合計の数値配列）→ 明細配列へ移行
function migrateWeekly(arr,k){
  if(!Array.isArray(arr)) return [];
  if(arr.length===0) return [];
  if(typeof arr[0]!=='number') return arr; // 既に明細形式
  const start=periodStartDate(k);
  const out=[];
  arr.forEach((v,i)=>{
    if(+v>0){
      const d=new Date(start); d.setDate(start.getDate()+i*7);
      out.push({date:fmtDate(d),amount:+v,memo:'第'+(i+1)+'週合計（旧データ）'});
    }
  });
  return out;
}

// 月データ取得（無ければ初期化）
function month(){
  if(!DB.months[curKey]){
    const exp={};
    CATS.forEach(c=>exp[c.key]={budget:c.budget,actual:0});
    DB.months[curKey]={ salary:0,bonus:0,exp, food:[], kosai:[] };
  }
  const M=DB.months[curKey];
  // カテゴリ補完＋予算は固定値で上書き＋autoFillは実績を自動入力
  CATS.forEach(c=>{
    if(!M.exp[c.key]) M.exp[c.key]={budget:c.budget,actual:0};
    M.exp[c.key].budget=c.budget;                 // 予算は固定（手動変更不可）
    if(c.autoFill) M.exp[c.key].actual=c.budget;  // 実績を自動入力
  });
  // 後方互換：食費・交際費を明細形式へ
  M.food = migrateWeekly(M.food, curKey);
  M.kosai = migrateWeekly(M.kosai, curKey);
  return M;
}

// ---- 描画 ----
function render(){
  const M=month();
  const r=keyToRange(curKey);
  document.getElementById('mLabel').textContent=r.label;
  document.getElementById('mRange').textContent=r.range;

  // カテゴリ一覧
  const list=document.getElementById('catList');
  list.innerHTML='';
  CATS.forEach(c=>{
    const e=M.exp[c.key];
    const row=document.createElement('div');
    row.className='row';
    const actualField = c.autoFill
      ? `<input class="num-in auto" type="number" value="${e.actual||''}" readonly tabindex="-1">`
      : `<input class="num-in" type="number" inputmode="numeric" data-act="${c.key}" value="${e.actual||''}" placeholder="0">`;
    const note = (c.note?'・'+c.note:'') + (c.autoFill?'・自動計上':'');
    row.innerHTML=`
      <div class="nm">
        <div class="n">${c.name}</div>
        <div class="b">予算 ${yen(e.budget)}${note}</div>
      </div>
      ${actualField}
      <span class="yen">円</span>`;
    list.appendChild(row);
    // 消化バー付きカテゴリ（消耗品など）
    if(c.bar){
      const bw=document.createElement('div');
      bw.className='cat-bar';
      bw.innerHTML=`
        <div class="cb-meta"><span id="catbarL_${c.key}">消化 0%</span><span id="catbarR_${c.key}">¥0 / ${yen(e.budget)}</span></div>
        <div class="mini-bar"><div class="mini-fill" id="catbar_${c.key}"></div></div>`;
      list.appendChild(bw);
    }
  });
  list.querySelectorAll('[data-act]').forEach(i=>i.oninput=()=>{
    M.exp[i.dataset.act].actual=+i.value||0; save(); refreshTotals();
  });

  // サブスク一覧
  renderSubs();

  // 食費・交際費（明細→週グループ）
  renderEntries(M.food, FOOD_WK, 'foodGroups');
  renderEntries(M.kosai, KOSAI_WK, 'kosaiGroups');
  // 入力フォームの日付を今日に初期化
  const today=fmtDate(new Date());
  ['food','kosai'].forEach(k=>{ const el=document.getElementById(k+'Date'); if(el && !el.value) el.value=today; });

  refreshTotals();
}

// 明細を週ごとにグループ化して描画
function renderEntries(arr,wkBud,groupsElId){
  const box=document.getElementById(groupsElId);
  box.innerHTML='';
  if(!arr.length){
    box.innerHTML='<div class="empty-note">まだ記録がありません。日付・金額を入力して「追加」を押してください。</div>';
    return;
  }
  const groups={};
  arr.forEach((e,idx)=>{
    const wi=weekIndex(e.date,curKey);
    (groups[wi]=groups[wi]||[]).push({e,idx});
  });
  Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach(wi=>{
    const items=groups[wi].sort((a,b)=> a.e.date<b.e.date?-1:a.e.date>b.e.date?1:0);
    const sum=items.reduce((a,o)=>a+(+o.e.amount||0),0);
    const p=wkBud?Math.min(100,Math.round(sum/wkBud*100)):0;
    const col=p<70?'var(--green)':p<100?'var(--amber)':'var(--red)';
    let rows='';
    items.forEach(o=>{
      rows+=`<div class="entry">`
        +`<span class="e-date">${shortDate(o.e.date)}</span>`
        +`<span class="e-memo">${escapeHtml(o.e.memo||'')}</span>`
        +`<span class="e-amt">${yen(o.e.amount)}</span>`
        +`<button class="e-del" data-del="${o.idx}" title="削除">×</button>`
        +`</div>`;
    });
    const g=document.createElement('div');
    g.className='wk-group';
    g.innerHTML=`
      <div class="wkg-h"><span class="wkg-n">第${wi+1}週</span><span class="wkg-r">${weekRange(wi,curKey)}</span></div>
      ${rows}
      <div class="mini-bar"><div class="mini-fill" style="width:${p}%;background:${col}"></div></div>
      <div class="wkg-foot"><span>消化 ${p}%</span><span>${yen(sum)} / ${yen(wkBud)}</span></div>`;
    box.appendChild(g);
  });
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    arr.splice(+b.dataset.del,1); save(); render();
  });
}

// 明細を1件追加
function addEntry(kind){
  const M=month();
  const arr = kind==='food'? M.food : M.kosai;
  const dEl=document.getElementById(kind+'Date');
  const aEl=document.getElementById(kind+'Amt');
  const mEl=document.getElementById(kind+'Memo');
  const amt=+aEl.value||0;
  if(!amt){ aEl.focus(); return; }
  const date = dEl.value || fmtDate(new Date());
  arr.push({date, amount:amt, memo:(mEl.value||'').trim()});
  save();
  aEl.value=''; mEl.value='';
  render();
  // 連続入力しやすいよう同じ日付を残す
  dEl.value=date;
  aEl.focus();
}

// ---- サブスク（追加・削除できる。予算=実績で自動計上） ----
function renderSubs(){
  const box=document.getElementById('subsList');
  box.innerHTML='';
  if(!DB.subs.length){
    box.innerHTML='<div class="empty-note">サブスクがありません。下の欄から追加できます。</div>';
  }else{
    DB.subs.forEach((s,idx)=>{
      const row=document.createElement('div');
      row.className='entry';
      row.innerHTML=`<span class="e-memo">${escapeHtml(s.name||'')}</span>`
        +`<span class="e-amt">${yen(s.amount)}</span>`
        +`<button class="e-del" data-subdel="${idx}" title="削除">×</button>`;
      box.appendChild(row);
    });
  }
  box.querySelectorAll('[data-subdel]').forEach(b=>b.onclick=()=>{
    DB.subs.splice(+b.dataset.subdel,1); save(); render();
  });
}
function addSub(){
  const nEl=document.getElementById('subName');
  const aEl=document.getElementById('subAmt');
  const name=(nEl.value||'').trim();
  const amt=+aEl.value||0;
  if(!name){ nEl.focus(); return; }
  if(!amt){ aEl.focus(); return; }
  DB.subs.push({name, amount:amt});
  save();
  nEl.value=''; aEl.value='';
  render();
  nEl.focus();
}

function refreshTotals(){
  const M=month();
  // 固定費実績
  let fixed=0;
  CATS.forEach(c=>{ fixed+=M.exp[c.key].actual||0; });
  // サブスク（予算=実績）
  const subsSum=DB.subs.reduce((a,s)=>a+(+s.amount||0),0);
  fixed += subsSum;

  document.getElementById('fixedTotal').textContent=yen(fixed);
  document.getElementById('subsTotal').textContent=yen(subsSum);

  // カテゴリ消化バー（消耗品など）
  CATS.forEach(c=>{
    if(!c.bar) return;
    const e=M.exp[c.key];
    const fill=document.getElementById('catbar_'+c.key);
    if(!fill) return;
    const p=e.budget? Math.min(100,Math.round((e.actual||0)/e.budget*100)) :0;
    fill.style.width=p+'%';
    fill.style.background= p<70?'var(--green)': p<100?'var(--amber)':'var(--red)';
    document.getElementById('catbarL_'+c.key).textContent=`消化 ${p}%`;
    document.getElementById('catbarR_'+c.key).textContent=`${yen(e.actual||0)} / ${yen(e.budget)}`;
  });

  // 食費・交際費 合計表示
  const foodSum=M.food.reduce((a,e)=>a+(+e.amount||0),0);
  const kosaiSum=M.kosai.reduce((a,e)=>a+(+e.amount||0),0);
  document.getElementById('foodTotal').textContent=`合計 ${yen(foodSum)}`;
  document.getElementById('kosaiTotal').textContent=`合計 ${yen(kosaiSum)}`;
}

// ---- タブ切り替え ----
let curTab = 'food';
function switchTab(kind){
  curTab = kind;
  const card = document.getElementById('entryCard');
  card.classList.toggle('tf', kind==='food');
  card.classList.toggle('tk', kind==='kosai');
  document.getElementById('panelFood').classList.toggle('active', kind==='food');
  document.getElementById('panelKosai').classList.toggle('active', kind==='kosai');
}

// ---- イベント ----
document.getElementById('tabFood').onclick=()=>switchTab('food');
document.getElementById('tabKosai').onclick=()=>switchTab('kosai');
document.getElementById('prevM').onclick=()=>{ curKey=shiftMonth(curKey,-1); render(); };
document.getElementById('nextM').onclick=()=>{ curKey=shiftMonth(curKey,1); render(); };
document.getElementById('foodAdd').onclick=()=>addEntry('food');
document.getElementById('kosaiAdd').onclick=()=>addEntry('kosai');
document.getElementById('subAdd').onclick=addSub;
document.getElementById('subName').addEventListener('keydown',e=>{ if(e.key==='Enter') addSub(); });
document.getElementById('subAmt').addEventListener('keydown',e=>{ if(e.key==='Enter') addSub(); });
document.getElementById('foodMemo').addEventListener('keydown',e=>{ if(e.key==='Enter') addEntry('food'); });
document.getElementById('kosaiMemo').addEventListener('keydown',e=>{ if(e.key==='Enter') addEntry('kosai'); });
document.getElementById('saveNow').onclick=()=>{
  if(!loaded){ setStatus('まだ読み込めていません。ページを再読み込みしてください'); return; }
  cloudSave();   // 予約済みの自動保存はcloudSave内でキャンセルして即実行
  refreshTotals();
};

init();
</script>
